<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Spelling Bee World Records</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 20px 0;
    }
    h1 { 
      color: #58a6ff; 
      margin-bottom: 5px; 
    }
    .subtitle {
      color: #8b949e;
      margin-top: 0;
      margin-bottom: 25px;
    }
    
    /* YouTube Banner / Main Link */
    .channel-banner {
      background: linear-gradient(135deg, #23272d 0%, #161b22 100%);
      border: 2px solid #ff0000;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
    }
    .channel-banner h2 { 
      color: #ffffff; 
      margin-top: 0; 
      margin-bottom: 10px;
    }
    .yt-btn {
      display: inline-block;
      background-color: #ff0000;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .yt-btn:hover {
      background-color: #cc0000;
    }
    
    /* Leaderboard Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 15px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #30363d;
    }
    th { 
      background-color: #21262d; 
      color: #8b949e; 
    }
    .empty-msg {
      text-align: center;
      color: #8b949e;
      padding: 30px 16px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Roblox Spelling Bee World Records</h1>
      <p class="subtitle">Official Leaderboards & Verified Submissions</p>
    </header>

    <!-- YouTube Link (Top Banner Only) -->
    <div class="channel-banner">
      <h2>Watch Official Runs & Proof</h2>
      <a href="https://www.youtube.com/@GamerSpellsXV" target="_blank" class="yt-btn">
        Visit GamerSpellsXV on YouTube
      </a>
    </div>

    <!-- Leaderboard Table -->
    <h2>Global Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Record / Streak</th>
          <th>Video Proof</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4" class="empty-msg">No submissions yet. Check back soon for official world records!</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
