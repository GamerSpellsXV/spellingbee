<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Bee Game</title>
  <style>
    /* basic Styling */
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto 20px auto;
    }
    .game-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 20px;
    }
    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    .button-group button {
      flex: 1;
    }
    .google-btn {
      background-color: #db4437;
    }
    .google-btn:hover {
      background-color: #c13527;
    }
    .error-msg {
      color: red;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🐝 Spelling Bee</h1>
    <div>
      <span id="userDisplay"></span>
      <button id="openAuthBtn">Sign In / Register</button>
      <button id="signOutBtn" style="display: none;">Sign Out</button>
    </div>
  </div>

  <div class="game-container">
    <h2>Welcome to Spelling Bee!</h2>
    <p>Type your guess and click submit.</p>
    <!-- Your game elements like board, letter tiles, etc. go here -->
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModalBtn">&times;</span>
      <h2>Account</h2>

      <input type="text" id="authUsername" placeholder="Username">
      <input type="email" id="authEmail" placeholder="Email Address">
      <input type="password" id="authPassword" placeholder="Password">
      <div id="authError" class="error-msg"></div>

      <div class="button-group">
        <button id="signInBtn">Sign In</button>
        <button id="signUpBtn">Register</button>
      </div>

      <hr style="width: 100%;">
      
      <button id="googleBtn" class="google-btn">Sign in with Google</button>
    </div>
  </div>

  <!-- Firebase JavaScript Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged,
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "AIzaSyDXnV5R1fl8ypfQhvdcSK5xZzR2PSrO6RM",
      authDomain: "spellingbee-74883.firebaseapp.com",
      projectId: "spellingbee-74883",
      storageBucket: "spellingbee-74883.firebasestorage.app",
      messagingSenderId: "123344802307",
      appId: "1:123344802307:web:77aa8ec2271e2b0da3f436"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // DOM Elements
    const authModal = document.getElementById("authModal");
    const openAuthBtn = document.getElementById("openAuthBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const signInBtn = document.getElementById("signInBtn");
    const signUpBtn = document.getElementById("signUpBtn");
    const googleBtn = document.getElementById("googleBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const userDisplay = document.getElementById("userDisplay");
    const authError = document.getElementById("authError");

    // Toggle Modal
    openAuthBtn.onclick = () => { authModal.style.display = "flex"; };
    closeModalBtn.onclick = () => { authModal.style.display = "none"; };
    window.onclick = (e) => { if (e.target === authModal) authModal.style.display = "none"; };

    // Register with Email & Username
    signUpBtn.addEventListener("click", async () => {
      authError.textContent = "";
      const username = document.getElementById("authUsername").value;
      const email = document.getElementById("authEmail").value;
      const password = document.getElementById("authPassword").value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        if (username) {
          await updateProfile(userCredential.user, { displayName: username });
        }
        authModal.style.display = "none";
      } catch (err) {
        authError.textContent = err.message;
      }
    });

    // Sign In with Email
    signInBtn.addEventListener("click", async () => {
      authError.textContent = "";
      const email = document.getElementById("authEmail").value;
      const password = document.getElementById("authPassword").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        authModal.style.display = "none";
      } catch (err) {
        authError.textContent = err.message;
      }
    });

    // Google Sign-In
    googleBtn.addEventListener("click", async () => {
      authError.textContent = "";
      try {
        await signInWithPopup(auth, provider);
        authModal.style.display = "none";
      } catch (err) {
        authError.textContent = err.message;
      }
    });

    // Sign Out
    signOutBtn.addEventListener("click", () => {
      signOut(auth);
    });

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const name = user.displayName || user.email;
        userDisplay.textContent = `Hi, ${name}! `;
        openAuthBtn.style.display = "none";
        signOutBtn.style.display = "inline-block";
      } else {
        userDisplay.textContent = "";
        openAuthBtn.style.display = "inline-block";
        signOutBtn.style.display = "none";
      }
    });
  </script>
</body>
</html>
