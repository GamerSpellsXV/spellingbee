<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Spelling Bee World Records</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    /* Top Bar Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    h1 { color: #58a6ff; margin: 0; font-size: 24px; }
    
    /* Auth Buttons & User Display */
    .auth-bar { display: flex; align-items: center; gap: 10px; }
    .user-tag { color: #238636; font-weight: bold; }
    .btn {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover { background-color: #30363d; }
    .btn-primary { background-color: #238636; color: white; border: none; }
    .btn-primary:hover { background-color: #2ea043; }

    /* YouTube Banner */
    .channel-banner {
      background: linear-gradient(135deg, #23272d 0%, #161b22 100%);
      border: 2px solid #ff0000;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
    }
    .channel-banner h2 { color: #ffffff; margin-top: 0; margin-bottom: 10px; }
    .yt-btn {
      display: inline-block;
      background-color: #ff0000;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none;
    }

    /* Leaderboard Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #30363d; }
    th { background-color: #21262d; color: #8b949e; }
    .empty-msg { text-align: center; color: #8b949e; padding: 30px 16px; font-style: italic; }

    /* Account Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
    }
    .modal-content h3 { margin-top: 0; color: #58a6ff; }
    .modal-content input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      color: white;
      border-radius: 5px;
    }
    .modal-actions { margin-top: 15px; text-align: right; }
    .error-msg { color: #f85149; font-size: 13px; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Spelling Bee Records</h1>
      <div class="auth-bar">
        <span id="userDisplay" class="user-tag" style="display:none;"></span>
        <button id="openAuthBtn" class="btn btn-primary" onclick="toggleModal(true)">Sign In / Register</button>
        <button id="logoutBtn" class="btn" style="display:none;" onclick="handleLogout()">Log Out</button>
      </div>
    </header>

    <!-- Top YouTube Link -->
    <div class="channel-banner">
      <h2>Watch Official Runs & Proof</h2>
      <a href="https://www.youtube.com/@GamerSpellsXV" target="_blank" class="yt-btn">
        Visit GamerSpellsXV on YouTube
      </a>
    </div>

    <!-- Leaderboard Table -->
    <h2>Global Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Record / Streak</th>
          <th>Video Proof</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4" class="empty-msg">No submissions yet. Sign in above to submit your record!</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Sign In / Sign Up Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Account Access</h3>
      <input type="email" id="authEmail" placeholder="Email Address">
      <input type="password" id="authPassword" placeholder="Password">
      <div id="authError" class="error-msg"></div>
      <div class="modal-actions">
        <button class="btn" onclick="toggleModal(false)">Cancel</button>
        <button class="btn" onclick="handleSignUp()">Sign Up</button>
        <button class="btn btn-primary" onclick="handleLogin()">Log In</button>
      </div>
    </div>
  </div>

  <!-- Firebase JavaScript SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ⚠️ PASTE YOUR 6 FIREBASE KEYS HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.toggleModal = (show) => {
      document.getElementById('authModal').style.display = show ? 'flex' : 'none';
      document.getElementById('authError').innerText = '';
    };

    window.handleSignUp = async () => {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        window.toggleModal(false);
      } catch (err) {
        document.getElementById('authError').innerText = err.message.replace("Firebase: ", "");
      }
    };

    window.handleLogin = async () => {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.toggleModal(false);
      } catch (err) {
        document.getElementById('authError').innerText = err.message.replace("Firebase: ", "");
      }
    };

    window.handleLogout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      const openBtn = document.getElementById('openAuthBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const userDisplay = document.getElementById('userDisplay');

      if (user) {
        openBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        userDisplay.style.display = 'inline-block';
        userDisplay.innerText = `👤 ${user.email.split('@')[0]}`;
      } else {
        openBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        userDisplay.style.display = 'none';
      }
    });
  </script>
</body>
</html>
